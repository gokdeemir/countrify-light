name: countrify
description: "A lightweight Countrify fork with offline country, state, and city search, emoji flags, and compact geo assets."
version: 2.5.0+light.1
homepage: https://github.com/gokdeemir/countrify-light
repository: https://github.com/gokdeemir/countrify-light
issue_tracker: https://github.com/gokdeemir/countrify-light/issues

topics:
  - country-picker
  - country
  - state
  - city
  - widgets

environment:
  sdk: ^3.0.0
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  csv: ^6.0.0
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^9.0.0

flutter:
  assets:
    - assets/geo/states/
    - assets/geo/cities/
  fonts:
    - family: CountrifyIcons
      fonts:
        - asset: assets/fonts/countrify_icons.ttf
