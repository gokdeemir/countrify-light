name: countrify_light
description: "Offline Flutter country, state, and city pickers with emoji flags, localized names, and compact bundled geo data."
version: 1.0.0
homepage: https://github.com/gokdeemir/countrify-light
repository: https://github.com/gokdeemir/countrify-light
issue_tracker: https://github.com/gokdeemir/countrify-light/issues

topics:
  - country-picker
  - country
  - state
  - city
  - widgets

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter:
  assets:
    - assets/geo/states/
    - assets/geo/cities/
  fonts:
    - family: CountrifyIcons
      fonts:
        - asset: assets/fonts/countrify_icons.ttf
